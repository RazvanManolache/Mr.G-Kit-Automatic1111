name: Tests

on:
- push
- pull_request

jobs:
  test:
    name: tests on CPU with empty model
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: 3.10.6
        cache: pip
        cache-dependency-path: |
          **/requirements*txt
          launch.py
    - name: Cache models
      id: cache-models
      uses: actions/cache@v4
      with:
        path: models
        key: "2023-12-30"
    - name: Install test dependencies
      run: pip install wait-for-it -r requirements-test.txt
      env:
        PIP_DISABLE_PIP_VERSION_CHECK: "1"
        PIP_PROGRESS_BAR: "off"
    - name: Setup environment
      run: python launch.py --skip-torch-cuda-test --exit
      env:
        PIP_DISABLE_PIP_VERSION_CHECK: "1"
        PIP_PROGRESS_BAR: "off"
        TORCH_INDEX_URL: https://download.pytorch.org/whl/cpu
        WEBUI_LAUNCH_LIVE_OUTPUT: "1"
        PYTHONUNBUFFERED: "1"
    - name: Print installed packages
      run: pip freeze
    - name: Start test server
      run: >
        python -m coverage run
        --data-file=.coverage.server
        launch.py
        --skip-prepare-environment
        --skip-torch-cuda-test
        --test-server
        --do-not-download-clip
        --no-half
        --disable-opt-split-attention
        --use-cpu all
        --api-server-stop
        2>&1 | tee output.txt &
    - name: Run tests
      run: |
        wait-for-it --service 127.0.0.1:7860 -t 20
        python -m pytest -vv --junitxml=test/results.xml --cov . --cov-report=xml --verify-base-url test
    - name: Kill test server
      if: always()
      run: curl -vv -XPOST http://127.0.0.1:7860/sdapi/v1/server-stop && sleep 10
    - name: Show coverage
      run: |
        python -m coverage combine .coverage*
        python -m coverage report -i
        python -m coverage html -i
    - name: Upload main app output
      uses: actions/github-script@v9
      if: (always()) && success() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.event_name != 'pull_request'
      with:
        script: |
          const publish = require('./.github/scripts/publish-build.cjs');
          await publish({github, context, core, glob, exec});
      env:
        BUILD_NAME: output
        BUILD_PATHS: output.txt
        BUILD_HIDDEN: 'false'
        BUILD_MISSING: warn
    - name: Upload coverage HTML
      uses: actions/github-script@v9
      if: (always()) && success() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.event_name != 'pull_request'
      with:
        script: |
          const publish = require('./.github/scripts/publish-build.cjs');
          await publish({github, context, core, glob, exec});
      env:
        BUILD_NAME: htmlcov
        BUILD_PATHS: htmlcov
        BUILD_HIDDEN: 'false'
        BUILD_MISSING: warn
    permissions:
      contents: write
